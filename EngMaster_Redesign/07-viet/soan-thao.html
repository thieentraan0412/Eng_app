<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soạn thảo · Bài viết · EngMaster</title>
<link rel="stylesheet" href="style.css">
<style>
  .ed-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .ed-title{
    flex:1 1 240px;min-width:0;height:38px;padding:0 2px;font-size:19px;font-weight:600;
    letter-spacing:-.024em;background:transparent;border:none;border-bottom:1px solid transparent;
    transition:border-color var(--t-fast);
  }
  .ed-title:focus{outline:none;border-bottom-color:var(--accent)}
  .ed-title::placeholder{color:var(--text-4)}
  .ed-count{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}

  .ed-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .ed-meta .input{flex:1 1 240px;height:32px;font-size:13px}

  /* Vùng soạn thảo: textarea trong suốt chồng lên lớp nền tô lỗi */
  .ed-wrap{position:relative;border:1px solid var(--border-2);border-radius:var(--r-lg);
    background:var(--surface);overflow:hidden;transition:border-color var(--t-fast)}
  .ed-wrap:focus-within{border-color:var(--accent);box-shadow:var(--sh-focus)}
  .ed-backdrop,.ed-area{
    padding:18px 20px;font-size:15.5px;line-height:1.75;font-family:inherit;
    letter-spacing:-.004em;white-space:pre-wrap;word-wrap:break-word;
  }
  .ed-backdrop{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}
  .ed-backdrop mark{
    background:transparent;color:transparent;
    border-bottom:2px wavy var(--err);text-decoration:underline;
    text-decoration-color:var(--err);text-decoration-style:wavy;text-underline-offset:3px;
  }
  .ed-area{position:relative;display:block;width:100%;min-height:280px;
    background:transparent;border:none;resize:vertical}
  .ed-area:focus{outline:none}

  /* Thanh trợ lý dưới */
  .assist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .assist-row{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:10px 13px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-md);font-size:13px;
  }
  .assist-label{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase;color:var(--text-4);
  }
  .assist-label .ico{width:13px;height:13px}
  .bad{font-weight:600;color:var(--err)}
  .fix{
    height:24px;padding:0 9px;border-radius:var(--r-xs);font-size:12.5px;font-weight:500;
    background:var(--surface-2);border:1px solid var(--border-2);transition:all var(--t-fast);
  }
  .fix:hover{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok)}
  .ghost-hint{color:var(--text-4);font-size:12.5px}
  @media (max-width:920px){
    .ed-head .btn{flex:0 0 auto}
    .ed-count{width:100%;order:9}
  }
</style>
</head>
<body class="app" data-page="viet" data-depth="1" data-title="Soạn thảo">

<div class="main">
<div class="wrap wrap-narrow">

  <a class="crumb" href="index.html"><i data-ico="left"></i> Danh sách bài viết</a>

  <div class="ed-head anim">
    <input class="ed-title" value="sentense example" placeholder="Tiêu đề bài viết…">
    <span class="ed-count" id="count">4 từ · 17 ký tự</span>
    <button class="btn btn-primary"><i data-ico="save"></i> Lưu</button>
    <button class="btn btn-icon btn-danger" title="Xóa bài"><i data-ico="trash"></i></button>
  </div>

  <div class="ed-meta anim">
    <input class="input" list="topics" placeholder="Chủ đề (tùy chọn)…">
    <datalist id="topics">
      <option>Giới thiệu bản thân</option><option>Thói quen hằng ngày</option>
      <option>Du lịch</option><option>Công việc</option><option>Môi trường</option>
      <option>Công nghệ</option><option>Giáo dục</option><option>Sức khỏe</option>
    </datalist>
    <button class="btn btn-sm"><i data-ico="dice"></i> Gợi ý đề bài</button>
  </div>

  <div class="ed-wrap anim anim-1">
    <div class="ed-backdrop" id="backdrop">My name is <mark>thien</mark></div>
    <textarea class="ed-area" id="area" spellcheck="false">My name is thien</textarea>
  </div>

  <div class="assist anim anim-2">
    <div class="assist-row">
      <span class="assist-label"><i data-ico="type"></i> Chính tả</span>
      <span class="bad">thien</span>
      <i data-ico="right" class="ico-sm"></i>
      <button class="fix">then</button>
      <button class="fix">thief</button>
      <button class="fix">thin</button>
      <div class="spacer"></div>
      <button class="btn btn-sm btn-ghost">Bỏ qua</button>
    </div>

    <div class="assist-row">
      <span class="assist-label"><i data-ico="sparkle"></i> Gợi ý</span>
      <span class="ghost-hint">Gõ tiếng Anh để nhận gợi ý từ tiếp theo…</span>
    </div>

    <div class="assist-row">
      <span class="assist-label"><i data-ico="target"></i> Kiểm tra câu</span>
      <span class="ghost-hint">Ngữ pháp, văn phong, dùng từ, collocation</span>
      <div class="spacer"></div>
      <button class="btn btn-sm"><i data-ico="check"></i> Kiểm tra ngay</button>
    </div>
  </div>

</div>
</div>

<script src="../app.js"></script>
<script>
  var area = document.getElementById('area'),
      back = document.getElementById('backdrop'),
      cnt  = document.getElementById('count');

  function esc(s){ return s.replace(/[&<>]/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }

  function sync(){
    var t = area.value;
    back.innerHTML = esc(t).replace(/\bthien\b/gi, '<mark>$&</mark>');
    var w = t.trim() ? t.trim().split(/\s+/).length : 0;
    cnt.textContent = w + ' từ · ' + t.length + ' ký tự';
  }
  area.addEventListener('input', sync);
  area.addEventListener('scroll', function(){ back.scrollTop = area.scrollTop; });
  sync();
</script>
</body>
</html>
