<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Cài đặt — EngMaster Dịch nhanh</title>
    <style>
      body {
        margin: 0;
        padding: 40px 24px;
        background: #0b1220;
        color: #e2e8f0;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        color: #94a3b8;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #334155;
        border-radius: 9px;
        background: #131c31;
        color: #e2e8f0;
        font-size: 14px;
      }
      input:focus {
        outline: 2px solid #4f46e5;
        outline-offset: 1px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
      }
      button {
        padding: 9px 18px;
        border: 0;
        border-radius: 9px;
        background: #4f46e5;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        color: #4ade80;
        font-size: 13px;
      }
      #status[hidden] {
        display: none;
      }
      .hint {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid #1e293b;
        font-size: 13px;
        color: #94a3b8;
      }
      code {
        padding: 2px 6px;
        border-radius: 5px;
        background: #1e293b;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EngMaster — Dịch nhanh</h1>
      <p>Dán địa chỉ trang web EngMaster của bạn để tiện ích biết mở cửa sổ dịch ở đâu.</p>

      <label for="app-url">Địa chỉ trang EngMaster</label>
      <input
        id="app-url"
        type="url"
        placeholder="https://ten-project.vercel.app"
        spellcheck="false"
        autocomplete="off"
      />

      <div class="row">
        <button id="save" type="button">Lưu</button>
        <span id="status" hidden>Đã lưu</span>
      </div>

      <div class="hint">
        Đổi phím tắt: mở <code>edge://extensions/shortcuts</code> (Chrome là
        <code>chrome://extensions/shortcuts</code>) rồi đặt lại tổ hợp cho mục
        “Mở Dịch nhanh”.
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
