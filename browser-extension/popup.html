<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Dịch nhanh</title>
    <style>
      /* Popup của Chrome/Edge tối đa 800x600, lấy gần hết cho khung dịch. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 784px;
        height: 568px;
        overflow: hidden;
        background: #0b1220;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      #frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #frame[hidden] {
        display: none;
      }
      #setup {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 32px;
        color: #e2e8f0;
      }
      #setup h1 {
        margin: 0;
        font-size: 18px;
      }
      #setup p {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.6;
        color: #94a3b8;
      }
      #setup button {
        align-self: flex-start;
        margin-top: 8px;
        padding: 9px 16px;
        border: 0;
        border-radius: 9px;
        background: #4f46e5;
        color: #fff;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Dịch nhanh" allow="clipboard-write" hidden></iframe>
    <section id="setup" hidden>
      <h1>Chưa đặt địa chỉ EngMaster</h1>
      <p>
        Tiện ích cần biết địa chỉ trang web EngMaster của bạn (ví dụ
        <b>https://ten-project.vercel.app</b>) thì mới mở được cửa sổ dịch.
      </p>
      <button id="open-options" type="button">Mở phần cài đặt</button>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
