<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Từ vựng · EngMaster</title>
<link rel="stylesheet" href="style.css">
<style>
  .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .new-deck{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    min-height:120px;padding:16px;text-align:center;
    border:1px dashed var(--border-2);border-radius:var(--r-lg);background:transparent;
    color:var(--text-3);transition:all var(--t-fast);
  }
  .new-deck:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
  .new-deck .ico{width:19px;height:19px}
  .new-deck b{font-size:13.5px;font-weight:600}
  .new-deck span{font-size:12px}
  .deck-stats{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);
    font-variant-numeric:tabular-nums}
  .dot-sep{width:2.5px;height:2.5px;border-radius:50%;background:var(--text-4);flex:0 0 auto}
</style>
</head>
<body class="app" data-page="tu-vung" data-depth="1" data-title="Từ vựng">

<div class="main">
<div class="wrap">

  <div class="page-head anim">
    <div>
      <h1>Từ vựng</h1>
      <p>Tạo và quản lý các bộ từ của bạn. Mỗi thẻ có thể kèm collocation, pattern và câu ví dụ.</p>
    </div>
    <div class="page-actions">
      <button class="btn"><i data-ico="inbox"></i> Nhập từ file</button>
      <button class="btn btn-primary" id="btnNew"><i data-ico="plus"></i> Tạo bộ từ</button>
    </div>
  </div>

  <!-- ---------------------------------------------------- Thanh công cụ -->
  <div class="toolbar anim anim-1">
    <label class="search">
      <i data-ico="search"></i>
      <input class="input" type="search" placeholder="Tìm bộ từ…">
    </label>
    <div class="spacer"></div>
    <select class="select" style="width:auto;min-width:158px">
      <option>Sắp xếp: Mới nhất</option>
      <option>Tên A → Z</option>
      <option>Số thẻ nhiều nhất</option>
      <option>Tiến độ thấp nhất</option>
    </select>
    <div class="segmented">
      <button class="is-active" title="Dạng lưới"><i data-ico="grid"></i></button>
      <button title="Dạng danh sách"><i data-ico="stack"></i></button>
    </div>
  </div>

  <!-- --------------------------------------------------- Form tạo bộ mới -->
  <div class="card card-pad anim anim-1" id="formNew" style="display:none;margin-bottom:14px">
    <div class="input-group">
      <input class="input" placeholder="Tên bộ từ mới (VD: IELTS Vocab 1)" autofocus>
      <button class="btn btn-primary"><i data-ico="plus"></i> Tạo bộ</button>
      <button class="btn btn-ghost" id="btnCancel">Hủy</button>
    </div>
  </div>

  <!-- ------------------------------------------------------- Lưới bộ từ -->
  <section class="grid g-auto anim anim-2">

    <a class="deck" href="chi-tiet.html">
      <span class="deck-tools">
        <span class="icon-btn" role="button" tabindex="0" title="Đổi tên" onclick="event.preventDefault()"><i data-ico="pencil"></i></span>
        <span class="icon-btn danger" role="button" tabindex="0" title="Xóa bộ" onclick="event.preventDefault()"><i data-ico="trash"></i></span>
      </span>
      <span class="deck-top">
        <span class="deck-mark">S</span>
        <span>
          <span class="deck-name">Silk (Reading)</span>
          <span class="deck-desc">Bộ từ vựng</span>
        </span>
      </span>
      <span class="bar bar-accent"><i style="width:97%"></i></span>
      <span class="deck-meta">
        <span class="deck-stats">73 thẻ <i class="dot-sep"></i> đã học 71</span>
        <span class="deck-go">Mở bộ <i data-ico="right"></i></span>
      </span>
    </a>

    <a class="deck" href="chi-tiet.html">
      <span class="deck-tools">
        <span class="icon-btn" role="button" tabindex="0" title="Đổi tên" onclick="event.preventDefault()"><i data-ico="pencil"></i></span>
        <span class="icon-btn danger" role="button" tabindex="0" title="Xóa bộ" onclick="event.preventDefault()"><i data-ico="trash"></i></span>
      </span>
      <span class="deck-top">
        <span class="deck-mark">P</span>
        <span>
          <span class="deck-name">Parttern</span>
          <span class="deck-desc">Bộ từ vựng</span>
        </span>
      </span>
      <span class="bar bar-accent"><i style="width:100%"></i></span>
      <span class="deck-meta">
        <span class="deck-stats">10 thẻ <i class="dot-sep"></i> đã học 10</span>
        <span class="deck-go">Mở bộ <i data-ico="right"></i></span>
      </span>
    </a>

    <a class="deck" href="chi-tiet.html">
      <span class="deck-tools">
        <span class="icon-btn" role="button" tabindex="0" title="Đổi tên" onclick="event.preventDefault()"><i data-ico="pencil"></i></span>
        <span class="icon-btn danger" role="button" tabindex="0" title="Xóa bộ" onclick="event.preventDefault()"><i data-ico="trash"></i></span>
      </span>
      <span class="deck-top">
        <span class="deck-mark"><i data-ico="bulb"></i></span>
        <span>
          <span class="deck-name">Từ đã lưu khi đọc</span>
          <span class="deck-desc">Các từ lưu khi bôi màu dịch</span>
        </span>
      </span>
      <span class="bar bar-accent"><i style="width:0%"></i></span>
      <span class="deck-meta">
        <span class="deck-stats">10 thẻ <i class="dot-sep"></i> chưa học</span>
        <span class="deck-go">Mở bộ <i data-ico="right"></i></span>
      </span>
    </a>

    <a class="deck" href="chi-tiet.html">
      <span class="deck-tools">
        <span class="icon-btn" role="button" tabindex="0" title="Đổi tên" onclick="event.preventDefault()"><i data-ico="pencil"></i></span>
        <span class="icon-btn danger" role="button" tabindex="0" title="Xóa bộ" onclick="event.preventDefault()"><i data-ico="trash"></i></span>
      </span>
      <span class="deck-top">
        <span class="deck-mark">A</span>
        <span>
          <span class="deck-name">ADV</span>
          <span class="deck-desc">Bộ từ vựng</span>
        </span>
      </span>
      <span class="bar bar-accent"><i style="width:40%"></i></span>
      <span class="deck-meta">
        <span class="deck-stats">5 thẻ <i class="dot-sep"></i> đã học 2</span>
        <span class="deck-go">Mở bộ <i data-ico="right"></i></span>
      </span>
    </a>

    <button class="new-deck" id="btnNew2">
      <i data-ico="plus"></i>
      <b>Tạo bộ từ mới</b>
      <span>Nhóm các thẻ theo chủ đề hoặc bài học</span>
    </button>

  </section>

</div>
</div>

<script src="../app.js"></script>
<script>
  function open(){ document.getElementById('formNew').style.display='block';
                   document.querySelector('#formNew .input').focus(); }
  document.getElementById('btnNew').onclick  = open;
  document.getElementById('btnNew2').onclick = open;
  document.getElementById('btnCancel').onclick = function(){
    document.getElementById('formNew').style.display='none'; };
</script>
</body>
</html>
