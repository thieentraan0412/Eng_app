<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sắp xếp từ · Bài tập · EngMaster</title>
<link rel="stylesheet" href="style.css">
<style>
  .q-label{font-size:12px;color:var(--text-3);text-align:center;font-variant-numeric:tabular-nums}
  .q-hint{
    display:inline-flex;align-items:center;gap:7px;margin-top:9px;
    padding:6px 12px;border-radius:var(--r-full);font-size:13px;color:var(--text-2);
    background:var(--surface-2);border:1px solid var(--border);
  }
  .q-hint .ico{width:14px;height:14px;color:var(--text-4)}
  .q-hint b{font-weight:600;color:var(--text)}

  /* Vùng đáp án */
  .answer{
    width:100%;min-height:88px;padding:14px;
    display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
    background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--r-lg);
  }
  .answer.filled{border-style:solid}
  .answer .placeholder{color:var(--text-4);font-size:13.5px;margin:auto}

  /* Kho từ */
  .bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
  .tokbtn{
    padding:7px 13px;font-size:14px;font-weight:500;letter-spacing:-.01em;
    background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);
    box-shadow:var(--sh-xs);transition:all var(--t-fast);
  }
  .tokbtn:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
  .tokbtn.used{opacity:.32;pointer-events:none}
  .answer .tokbtn{box-shadow:none;background:var(--surface-2)}
  .answer .tokbtn:hover{background:var(--err-soft);border-color:var(--err-border);color:var(--err)}

  .actions{display:flex;gap:8px;justify-content:center;width:100%;flex-wrap:wrap}
  @media (max-width:920px){ .focus-foot{display:none} .actions .btn{flex:1 1 auto} }
</style>
</head>
<body>

<div class="focus">

  <header class="focus-bar">
    <a class="icon-btn" href="index.html" aria-label="Thoát"><i data-ico="x"></i></a>
    <span class="bar bar-accent"><i style="width:4%"></i></span>
    <span class="badge badge-ok"><i data-ico="check"></i> 0 đúng</span>
    <button class="icon-btn" data-theme-toggle aria-label="Đổi giao diện"></button>
  </header>

  <div class="focus-stage">

    <div style="text-align:center">
      <p class="q-label">Câu 1 / 25 · Sắp xếp các từ thành câu đúng</p>
      <p class="q-hint"><i data-ico="bulb"></i> Gợi ý: <b>emperor</b> — hoàng đế</p>
    </div>

    <div class="answer" id="answer">
      <span class="placeholder">Bấm các từ bên dưới để xếp câu…</span>
    </div>

    <div class="bank" id="bank">
      <button class="tokbtn">Emperor</button>
      <button class="tokbtn">was</button>
      <button class="tokbtn">Pope.</button>
      <button class="tokbtn">conflict</button>
      <button class="tokbtn">the</button>
      <button class="tokbtn">The</button>
      <button class="tokbtn">and</button>
      <button class="tokbtn">Investiture</button>
      <button class="tokbtn">the</button>
      <button class="tokbtn">a</button>
      <button class="tokbtn">between</button>
      <button class="tokbtn">Controversy</button>
    </div>

    <div class="actions">
      <button class="btn" id="undo"><i data-ico="undo"></i> Bỏ từ cuối</button>
      <button class="btn btn-primary"><i data-ico="check"></i> Kiểm tra</button>
    </div>

    <p class="focus-foot">
      <span>Bấm từ trong câu để trả lại kho</span>
      <span><span class="kbd">Esc</span> thoát</span>
    </p>
  </div>
</div>

<script src="../app.js"></script>
<script>
  var answer = document.getElementById('answer'),
      bank   = document.getElementById('bank'),
      ph     = answer.querySelector('.placeholder'),
      stack  = [];

  function sync(){
    answer.classList.toggle('filled', stack.length > 0);
    ph.style.display = stack.length ? 'none' : '';
  }
  bank.querySelectorAll('.tokbtn').forEach(function(src){
    src.onclick = function(){
      src.classList.add('used');
      var b = document.createElement('button');
      b.className = 'tokbtn'; b.textContent = src.textContent;
      b.onclick = function(){ b.remove(); src.classList.remove('used');
                              stack = stack.filter(function(x){ return x.el !== b; }); sync(); };
      answer.appendChild(b); stack.push({ el:b, src:src }); sync();
    };
  });
  document.getElementById('undo').onclick = function(){
    var last = stack.pop(); if (!last) return;
    last.el.remove(); last.src.classList.remove('used'); sync();
  };
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') location.href = 'index.html'; });
</script>
</body>
</html>
