<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chép câu · EngMaster</title>
<link rel="stylesheet" href="style.css">
<style>
  .new-folder{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    min-height:120px;padding:16px;text-align:center;color:var(--text-3);
    border:1px dashed var(--border-2);border-radius:var(--r-lg);transition:all var(--t-fast);
  }
  .new-folder:hover{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
  .new-folder b{font-size:13.5px;font-weight:600}
  .new-folder span{font-size:12px}
</style>
</head>
<body class="app" data-page="chep-cau" data-depth="1" data-title="Chép câu">

<div class="main">
<div class="wrap">

  <div class="page-head anim">
    <div>
      <h1>Chép câu</h1>
      <p>Tạo thư mục và quản lý các câu luyện dịch Việt → Anh. Dữ liệu đồng bộ đám mây.</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-primary" id="btnNew"><i data-ico="plus"></i> Tạo thư mục</button>
    </div>
  </div>

  <div class="card card-pad anim anim-1" id="formNew" style="display:none;margin-bottom:14px">
    <div class="input-group">
      <input class="input" placeholder="Tên thư mục mới (VD: Session 2)" autofocus>
      <button class="btn btn-primary"><i data-ico="plus"></i> Tạo thư mục</button>
      <button class="btn btn-ghost" id="btnCancel">Hủy</button>
    </div>
  </div>

  <section class="grid g-auto anim anim-2">

    <a class="deck" href="thu-muc.html">
      <span class="deck-tools">
        <span class="icon-btn" role="button" tabindex="0" title="Đổi tên" onclick="event.preventDefault()"><i data-ico="pencil"></i></span>
        <span class="icon-btn danger" role="button" tabindex="0" title="Xóa" onclick="event.preventDefault()"><i data-ico="trash"></i></span>
      </span>
      <span class="deck-top">
        <span class="deck-mark"><i data-ico="folder"></i></span>
        <span>
          <span class="deck-name">Session 1</span>
          <span class="deck-desc">Đã làm 95 / 100 câu</span>
        </span>
      </span>
      <span class="bar bar-accent"><i style="width:95%"></i></span>
      <span class="deck-meta">
        <span class="badge badge-ok"><i data-ico="check"></i> 93 đúng</span>
        <span class="deck-go">Mở thư mục <i data-ico="right"></i></span>
      </span>
    </a>

    <a class="deck" href="thu-muc.html">
      <span class="deck-tools">
        <span class="icon-btn" role="button" tabindex="0" title="Đổi tên" onclick="event.preventDefault()"><i data-ico="pencil"></i></span>
        <span class="icon-btn danger" role="button" tabindex="0" title="Xóa" onclick="event.preventDefault()"><i data-ico="trash"></i></span>
      </span>
      <span class="deck-top">
        <span class="deck-mark"><i data-ico="folder"></i></span>
        <span>
          <span class="deck-name">advance</span>
          <span class="deck-desc">Đã làm 0 / 100 câu</span>
        </span>
      </span>
      <span class="bar bar-accent"><i style="width:0%"></i></span>
      <span class="deck-meta">
        <span class="badge">Chưa bắt đầu</span>
        <span class="deck-go">Mở thư mục <i data-ico="right"></i></span>
      </span>
    </a>

    <button class="new-folder" id="btnNew2">
      <i data-ico="plus"></i>
      <b>Tạo thư mục mới</b>
      <span>Nhóm câu luyện dịch theo buổi học hoặc trình độ</span>
    </button>

  </section>

</div>
</div>

<script src="../app.js"></script>
<script>
  function open(){ document.getElementById('formNew').style.display='block';
                   document.querySelector('#formNew .input').focus(); }
  document.getElementById('btnNew').onclick  = open;
  document.getElementById('btnNew2').onclick = open;
  document.getElementById('btnCancel').onclick = function(){
    document.getElementById('formNew').style.display='none'; };
</script>
</body>
</html>
