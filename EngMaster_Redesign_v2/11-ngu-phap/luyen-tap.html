<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện ngữ pháp · EngMaster</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ------------------------------------------------------------ Thẻ câu hỏi */
  .qcard{
    width:100%;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-lg);overflow:hidden;
  }
  .qcard-head{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:11px 18px;border-bottom:1px solid var(--border);background:var(--surface-2);
  }
  .q-topic{margin-left:auto;font-size:11.8px;color:var(--text-3);white-space:nowrap}
  .qcard-body{padding:20px 18px}
  .q-instr{font-size:12.5px;color:var(--text-3);margin-bottom:12px}

  .q-sent{
    font-size:19px;line-height:1.95;letter-spacing:-.014em;color:var(--text);
    word-break:break-word;
  }
  .q-cue{
    font-size:13px;font-style:italic;color:var(--text-4);
    background:var(--surface-2);border:1px solid var(--border);
    padding:1px 8px;border-radius:var(--r-full);white-space:nowrap;
  }

  /* Ô điền inline */
  .blank{
    display:inline-block;min-width:118px;height:34px;padding:0 10px;vertical-align:baseline;
    font-size:17px;font-weight:600;letter-spacing:-.014em;color:var(--accent-text);
    background:var(--surface);border:none;border-bottom:2px solid var(--border-2);
    border-radius:4px 4px 0 0;text-align:center;transition:border-color var(--t-fast),background var(--t-fast);
  }
  .blank::placeholder{font-weight:400;color:var(--text-4);font-size:14px}
  .blank:hover{background:var(--surface-2)}
  .blank:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-soft)}
  .blank[readonly]{pointer-events:none}
  .blank.is-right{color:var(--ok);border-bottom-color:var(--ok)}
  .blank.is-wrong{color:var(--err);border-bottom-color:var(--err);text-decoration:line-through}

  /* Token bấm được (dạng sửa lỗi) */
  .toks{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
  .tok-btn{
    font-size:18px;line-height:1.6;letter-spacing:-.014em;color:var(--text);
    padding:2px 5px;border-radius:6px;border:1px solid transparent;
    transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast);
  }
  .tok-btn:hover{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent-text)}
  .tok-btn.is-right{background:var(--ok-soft);border-color:var(--ok-border);color:var(--ok);font-weight:600}
  .tok-btn.is-wrong{background:var(--err-soft);border-color:var(--err-border);color:var(--err);
    text-decoration:line-through;text-decoration-thickness:1px}
  .tok-btn.is-locked{pointer-events:none}
  .tok-plain{font-size:18px;line-height:1.6;letter-spacing:-.014em;padding:2px 3px;color:var(--text)}

  /* Trắc nghiệm */
  .options{display:flex;flex-direction:column;gap:8px;width:100%}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    padding:12px 14px;background:var(--surface);
    border:1px solid var(--border-2);border-radius:var(--r-md);box-shadow:var(--sh-xs);
    transition:all var(--t-fast);font-size:14.5px;
  }
  .opt:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
  .opt-key{
    width:22px;height:22px;flex:0 0 auto;border-radius:5px;display:grid;place-items:center;
    font-size:11.5px;font-weight:600;color:var(--text-3);
    background:var(--surface-2);border:1px solid var(--border);transition:all var(--t-fast);
  }
  .opt:hover .opt-key{background:var(--surface);border-color:var(--accent-border);color:var(--accent-text)}
  .opt .ico{margin-left:auto;opacity:0;width:16px;height:16px;transition:opacity var(--t-fast)}
  .opt.is-right{border-color:var(--ok-border);background:var(--ok-soft);color:var(--ok)}
  .opt.is-right .opt-key{background:var(--ok);border-color:var(--ok);color:#fff}
  .opt.is-right .ico{opacity:1}
  .opt.is-wrong{border-color:var(--err-border);background:var(--err-soft);color:var(--err)}
  .opt.is-wrong .opt-key{background:var(--err);border-color:var(--err);color:#fff}
  .opt.is-wrong .ico{opacity:1}
  .opt.is-locked{pointer-events:none}

  /* Viết lại câu */
  .src{
    display:flex;align-items:flex-start;gap:10px;
    padding:13px 15px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--r-md);font-size:15.5px;line-height:1.6;
  }
  .src .ico{width:15px;height:15px;color:var(--text-4);margin-top:4px}

  /* ------------------------------------------------------------- Phản hồi */
  .fb{
    width:100%;border:1px solid var(--border);border-radius:var(--r-lg);
    background:var(--surface);overflow:hidden;
  }
  .fb-head{
    display:flex;align-items:center;gap:8px;padding:11px 18px;
    font-size:13.5px;font-weight:600;letter-spacing:-.014em;border-bottom:1px solid var(--border);
  }
  .fb-head .ico{width:16px;height:16px}
  .fb-ok  .fb-head{background:var(--ok-soft); color:var(--ok); border-bottom-color:var(--ok-border)}
  .fb-err .fb-head{background:var(--err-soft);color:var(--err);border-bottom-color:var(--err-border)}
  .fb-body{padding:14px 18px}
  .fb-sent{font-size:15px;line-height:1.65;color:var(--text)}
  .fb-sent mark{background:var(--accent-soft);color:var(--accent-text);font-weight:600;
    padding:1px 5px;border-radius:5px}
  .fb-yours{font-size:12.8px;color:var(--text-3);margin-top:7px}
  .fb-yours s{color:var(--err);text-decoration-thickness:1px}
  .fb-why{
    font-size:13px;line-height:1.6;color:var(--text-2);margin-top:11px;
    padding-left:11px;border-left:2px solid var(--border-2);
  }
  .fb-foot{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 18px;border-top:1px solid var(--border);background:var(--surface-2);
    font-size:12px;color:var(--text-3);
  }
  .fb-foot a{color:var(--accent-text);font-weight:500}
  .fb-foot a:hover{text-decoration:underline}

  /* -------------------------------------------------------------- Hành động */
  .q-actions{display:flex;align-items:center;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}

  /* ------------------------------------------------------------ Kết quả */
  .res{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
  .ring-lg{
    --p:0;position:relative;width:104px;height:104px;flex:0 0 auto;border-radius:50%;
    display:grid;place-items:center;
    background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-3) 0);
  }
  .ring-lg > span{
    width:84px;height:84px;border-radius:50%;background:var(--surface);
    display:grid;place-items:center;font-size:25px;font-weight:700;
    font-variant-numeric:tabular-nums;letter-spacing:-.038em;
  }
  .res-title{font-size:21px;font-weight:600;letter-spacing:-.026em;text-align:center}
  .res-sub{font-size:13.5px;color:var(--text-3);text-align:center;max-width:44ch}
  .res-list{width:100%}
  .res-row{
    display:flex;align-items:flex-start;gap:11px;padding:12px 16px;
    border-bottom:1px solid var(--border);
  }
  .res-row:last-child{border-bottom:none}
  .res-main{flex:1 1 auto;min-width:0;font-size:13.2px;line-height:1.6}
  .res-main s{color:var(--err);text-decoration-thickness:1px}
  .res-main b{color:var(--ok)}
  .res-main span{display:block;font-size:11.8px;color:var(--text-4);margin-top:2px}

  @media (max-width:920px){
    .q-sent{font-size:17px;line-height:1.9}
    .tok-btn,.tok-plain{font-size:16px}
    .blank{min-width:96px;font-size:15.5px}
    .qcard-body{padding:16px 15px}
    .focus-foot{display:none}
  }
</style>
</head>
<body>

<div class="focus">

  <header class="focus-bar">
    <a class="icon-btn" href="index.html" aria-label="Thoát"><i data-ico="x"></i></a>
    <span class="bar bar-accent"><i id="prog" style="width:0%"></i></span>
    <span class="badge badge-ok" id="scoreBadge"><i data-ico="check"></i> 0 đúng</span>
    <button class="icon-btn" data-theme-toggle aria-label="Đổi giao diện"></button>
  </header>

  <div class="focus-stage" id="stage"></div>
</div>

<script src="../app.js"></script>
<script>
(function () {
  'use strict';

  /* ==========================================================  DỮ LIỆU
     Mỗi câu gắn: chủ điểm, nhóm lỗi người Việt, và một câu giải thích quy tắc.
     ======================================================================== */
  var QS = [
    {
      type: 'cloze',
      topic: 'Hiện tại hoàn thành', level: 'B1', tag: 'Nhầm thì',
      instr: 'Chia động từ trong ngoặc cho đúng.',
      sent: 'She ___ in Da Nang for six years.',
      cue: 'live',
      answers: ['has lived'],
      full: 'She <mark>has lived</mark> in Da Nang for six years.',
      why: '“for six years” là khoảng thời gian <b>chưa kết thúc</b> — sự việc bắt đầu trong quá khứ và còn kéo tới hiện tại, nên dùng hiện tại hoàn thành <span class="mono">has + V3</span>, không dùng quá khứ đơn.'
    },
    {
      type: 'correct',
      topic: 'Mạo từ a / an / the', level: 'A1', tag: 'Thiếu mạo từ',
      instr: 'Bấm vào từ bị sai trong câu, rồi gõ dạng đúng.',
      toks: ['My', 'sister', 'is', 'teacher', 'at', 'a', 'primary', 'school.'],
      errIndex: 3,
      answers: ['a teacher'],
      full: 'My sister is <mark>a teacher</mark> at a primary school.',
      why: 'Danh từ đếm được số ít <b>luôn</b> cần một từ hạn định đứng trước. Tiếng Việt nói “chị tôi là giáo viên” không cần mạo từ, nên đây là lỗi bị bỏ sót nhiều nhất.'
    },
    {
      type: 'mcq',
      topic: 'Hiện tại hoàn thành', level: 'B1', tag: 'Nhầm since / for',
      instr: 'Chọn từ đúng để hoàn thành câu.',
      sent: 'He has worked at this company ___ five years.',
      options: ['for', 'since', 'from', 'during'],
      right: 0,
      answers: ['for'],
      full: 'He has worked at this company <mark>for</mark> five years.',
      why: '<span class="mono">for</span> đi với <b>độ dài</b> thời gian (five years), <span class="mono">since</span> đi với <b>mốc</b> thời gian (2019, Monday). Tiếng Việt dùng chung chữ “từ” nên cặp này rất dễ nhầm.'
    },
    {
      type: 'transform',
      topic: 'Câu bị động', level: 'B1', tag: 'Biến đổi cấu trúc',
      instr: 'Viết lại câu sau ở thể bị động.',
      src: 'The company launched a new app last month.',
      hint: 'Bắt đầu bằng “A new app…” · 9 từ',
      answers: [
        'A new app was launched by the company last month',
        'A new app was launched last month by the company'
      ],
      full: '<mark>A new app was launched by the company</mark> last month.',
      why: 'Bị động quá khứ đơn = <span class="mono">was / were + V3</span>. Tân ngữ <b>a new app</b> lên làm chủ ngữ, chủ ngữ cũ đi sau <span class="mono">by</span>. Trạng ngữ thời gian giữ nguyên ở cuối.'
    },
    {
      type: 'cloze',
      topic: 'Hòa hợp chủ ngữ – động từ', level: 'A2', tag: 'Thiếu -s ngôi 3',
      instr: 'Chia động từ trong ngoặc cho đúng.',
      sent: 'My brother ___ to the gym every morning.',
      cue: 'go',
      answers: ['goes'],
      full: 'My brother <mark>goes</mark> to the gym every morning.',
      why: 'Chủ ngữ <b>my brother</b> là ngôi thứ ba số ít, thì hiện tại đơn → động từ thêm <span class="mono">-es</span>. Động từ tiếng Việt không đổi theo chủ ngữ nên bước này rất hay bị bỏ.'
    },
    {
      type: 'correct',
      topic: 'Danh từ số nhiều', level: 'A1', tag: 'Thiếu -s số nhiều',
      instr: 'Bấm vào từ bị sai trong câu, rồi gõ dạng đúng.',
      toks: ['I', 'bought', 'three', 'book', 'at', 'the', 'fair', 'yesterday.'],
      errIndex: 3,
      answers: ['books'],
      full: 'I bought three <mark>books</mark> at the fair yesterday.',
      why: 'Sau số đếm lớn hơn một, danh từ đếm được phải ở dạng số nhiều. Tiếng Việt để “ba quyển sách” là đủ nghĩa nên đuôi <span class="mono">-s</span> thường bị quên.'
    }
  ];

  var LABEL = { cloze: 'Điền vào chỗ trống', correct: 'Sửa lỗi sai', mcq: 'Trắc nghiệm', transform: 'Viết lại câu' };
  var TICON = { cloze: 'pencil', correct: 'alert', mcq: 'tasks', transform: 'refresh' };

  /* ==========================================================  TRẠNG THÁI */
  var order = QS.map(function (_, i) { return i; });
  var pos = 0, score = 0, answered = false, picked = false, wrong = [];

  var stage = document.getElementById('stage');
  var prog = document.getElementById('prog');
  var scoreBadge = document.getElementById('scoreBadge');

  /* ==========================================================  TIỆN ÍCH */
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[‘’]/g, "'")
      .replace(/[.?!,;]+$/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function match(v, list) {
    var n = norm(v);
    if (!n) return false;
    for (var i = 0; i < list.length; i++) { if (norm(list[i]) === n) return true; }
    return false;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ==========================================================  DỰNG CÂU HỎI */
  function questionHtml(q) {
    var body = '';

    if (q.type === 'cloze') {
      body =
        '<p class="q-instr">' + q.instr + '</p>' +
        '<p class="q-sent">' +
          esc(q.sent).replace('___',
            '<input class="blank" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">') +
          ' <span class="q-cue">' + esc(q.cue) + '</span>' +
        '</p>';
    }

    if (q.type === 'correct') {
      var toks = q.toks.map(function (t, i) {
        return '<button class="tok-btn" data-i="' + i + '">' + esc(t) + '</button>';
      }).join('');
      body =
        '<p class="q-instr">' + q.instr + '</p>' +
        '<div class="toks" id="toks">' + toks + '</div>';
    }

    if (q.type === 'mcq') {
      var opts = q.options.map(function (o, i) {
        return '<button class="opt" data-i="' + i + '"><span class="opt-key">' + (i + 1) + '</span> ' +
               esc(o) + ' <i data-ico="check"></i></button>';
      }).join('');
      body =
        '<p class="q-instr">' + q.instr + '</p>' +
        '<p class="q-sent" style="margin-bottom:14px">' + esc(q.sent).replace('___',
          '<span style="color:var(--text-4)">______</span>') + '</p>' +
        '<div class="options" id="opts">' + opts + '</div>';
    }

    if (q.type === 'transform') {
      body =
        '<p class="q-instr">' + q.instr + '</p>' +
        '<div class="src"><i data-ico="file"></i><span>' + esc(q.src) + '</span></div>' +
        '<textarea class="textarea" id="ans" rows="2" style="margin-top:12px;min-height:74px" ' +
          'autocomplete="off" autocapitalize="off" spellcheck="false" ' +
          'placeholder="Gõ câu viết lại của bạn…"></textarea>' +
        '<p class="t-xs muted-2" style="margin-top:7px"><i data-ico="bulb" class="ico ico-sm" ' +
          'style="display:inline-block;vertical-align:-3px;margin-right:4px"></i>' + esc(q.hint) + '</p>';
    }

    return '' +
      '<div class="qcard anim">' +
        '<div class="qcard-head">' +
          '<span class="badge badge-accent"><i data-ico="' + TICON[q.type] + '"></i> ' + LABEL[q.type] + '</span>' +
          '<span class="badge">' + esc(q.level) + '</span>' +
          '<span class="q-topic">' + esc(q.topic) + '</span>' +
        '</div>' +
        '<div class="qcard-body">' + body + '</div>' +
      '</div>';
  }

  function actionsHtml(main, ghost) {
    return '<div class="q-actions" id="actions">' +
      (ghost ? '<button class="btn btn-ghost" id="btnSkip">Bỏ qua</button>' : '') +
      '<button class="btn btn-primary btn-lg" id="btnMain">' + main + '</button>' +
    '</div>';
  }

  function footHtml(q) {
    var keys = (q.type === 'mcq')
      ? '<span>Bấm <span class="kbd">1</span>–<span class="kbd">4</span> để chọn</span>'
      : '<span><span class="kbd">Enter</span> kiểm tra</span>';
    return '<p class="focus-foot">' + keys +
      '<span><span class="kbd">Enter</span> sang câu tiếp</span>' +
      '<span><span class="kbd">Esc</span> thoát</span></p>';
  }

  /* ==========================================================  VẼ MÀN HÌNH */
  function render() {
    var q = QS[order[pos]];
    answered = false; picked = false;

    prog.style.width = (pos / order.length * 100) + '%';
    scoreBadge.innerHTML = window.EMIcon('check') + ' ' + score + ' đúng';

    stage.innerHTML =
      '<p class="t-xs muted-2 num">Câu ' + (pos + 1) + ' / ' + order.length + '</p>' +
      questionHtml(q) +
      '<div id="fbSlot"></div>' +
      actionsHtml('Kiểm tra', true) +
      footHtml(q);

    window.EMHydrate();
    bind(q);
  }

  function bind(q) {
    var main = document.getElementById('btnMain');
    var skip = document.getElementById('btnSkip');
    if (skip) skip.onclick = function () { reveal(q); finishQuestion(q, false, 'bỏ qua'); };
    main.onclick = function () { submit(q); };

    if (q.type === 'cloze' || q.type === 'transform') {
      var el = document.getElementById('ans');
      if (el) el.focus();
    }

    if (q.type === 'mcq') {
      document.querySelectorAll('#opts .opt').forEach(function (o) {
        o.onclick = function () { pickOption(q, +o.dataset.i); };
      });
    }

    if (q.type === 'correct') {
      document.querySelectorAll('#toks .tok-btn').forEach(function (b) {
        b.onclick = function () { pickToken(q, +b.dataset.i, b); };
      });
    }
  }

  /* ---- Hé lộ đáp án khi người học bỏ qua ---- */
  function reveal(q) {
    if (q.type === 'mcq') {
      document.querySelectorAll('#opts .opt').forEach(function (o) {
        o.classList.add('is-locked');
        if (+o.dataset.i === q.right) o.classList.add('is-right');
      });
    }
    if (q.type === 'correct') {
      document.querySelectorAll('#toks .tok-btn').forEach(function (b) {
        b.classList.add('is-locked');
        if (+b.dataset.i === q.errIndex) b.classList.add('is-right');
      });
    }
    var el = document.getElementById('ans');
    if (el) el.readOnly = true;
  }

  /* ---- Trắc nghiệm: chọn là chấm luôn ---- */
  function pickOption(q, i) {
    if (answered) return;
    var opts = document.querySelectorAll('#opts .opt');
    opts.forEach(function (o) {
      o.classList.add('is-locked');
      if (+o.dataset.i === q.right) o.classList.add('is-right');
    });
    if (i !== q.right) opts[i].classList.add('is-wrong');
    finishQuestion(q, i === q.right, q.options[i]);
  }

  /* ---- Sửa lỗi: bước 1 tìm token sai, bước 2 gõ dạng đúng ---- */
  function pickToken(q, i, btn) {
    if (answered || picked) return;

    if (i !== q.errIndex) {
      /* Chọn nhầm chỗ — coi như sai, hé lộ token đúng */
      document.querySelectorAll('#toks .tok-btn').forEach(function (b) {
        b.classList.add('is-locked');
        if (+b.dataset.i === q.errIndex) b.classList.add('is-right');
      });
      btn.classList.add('is-wrong');
      finishQuestion(q, false, q.toks[i], 'Chỗ sai không nằm ở từ này.');
      return;
    }

    /* Đúng chỗ — mở ô nhập ngay tại vị trí đó */
    picked = true;
    var w = Math.max(q.toks[i].length + 4, 10);
    var input = document.createElement('input');
    input.className = 'blank';
    input.id = 'ans';
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('spellcheck', 'false');
    input.setAttribute('autocapitalize', 'off');
    input.placeholder = q.toks[i];
    input.size = w;
    input.style.minWidth = (w * 9) + 'px';
    btn.replaceWith(input);
    input.focus();
    document.getElementById('btnMain').textContent = 'Kiểm tra';
  }

  /* ---- Nộp bài ---- */
  function submit(q) {
    if (answered) { next(); return; }

    if (q.type === 'mcq') return;                       /* chấm ngay khi bấm đáp án */

    if (q.type === 'correct' && !picked) {
      var toks = document.getElementById('toks');
      toks.animate(
        [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' },
         { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
        { duration: 220 }
      );
      return;
    }

    var el = document.getElementById('ans');
    var val = el ? el.value : '';
    if (!norm(val)) { if (el) el.focus(); return; }

    var right = match(val, q.answers);

    if (q.type === 'correct') {
      el.readOnly = true;
      el.classList.add(right ? 'is-right' : 'is-wrong');
      document.querySelectorAll('#toks .tok-btn').forEach(function (b) { b.classList.add('is-locked'); });
    } else if (q.type === 'cloze') {
      el.readOnly = true;
      el.classList.add(right ? 'is-right' : 'is-wrong');
    } else {
      el.readOnly = true;
    }

    finishQuestion(q, right, val);
  }

  /* ---- Hiện phản hồi ---- */
  function finishQuestion(q, right, userAnswer, extra) {
    answered = true;
    if (right) score++;
    else wrong.push({ q: q, user: userAnswer });

    var yours = right ? '' :
      '<p class="fb-yours">Bạn viết: <s>' + esc(userAnswer) + '</s>' +
      (extra ? ' · ' + esc(extra) : '') + '</p>';

    document.getElementById('fbSlot').innerHTML =
      '<div class="fb ' + (right ? 'fb-ok' : 'fb-err') + ' anim" style="margin-top:4px">' +
        '<div class="fb-head">' + window.EMIcon(right ? 'check' : 'x') +
          (right ? 'Chính xác' : 'Chưa đúng') + '</div>' +
        '<div class="fb-body">' +
          '<p class="fb-sent">' + q.full + '</p>' + yours +
          '<p class="fb-why"><b style="color:var(--text)">Vì sao:</b> ' + q.why + '</p>' +
        '</div>' +
        '<div class="fb-foot">' +
          '<span class="badge">' + esc(q.tag) + '</span>' +
          '<a href="chi-tiet.html">Mở bài học “' + esc(q.topic) + '”</a>' +
          (right ? '' :
            '<span class="spacer"></span>' +
            '<span class="row" style="gap:5px">' + window.EMIcon('flag', 'ico-sm') +
            'Đã thêm vào sổ lỗi · ôn lại sau 1 ngày</span>') +
        '</div>' +
      '</div>';

    scoreBadge.innerHTML = window.EMIcon('check') + ' ' + score + ' đúng';
    prog.style.width = ((pos + 1) / order.length * 100) + '%';

    var skip = document.getElementById('btnSkip');
    if (skip) skip.remove();
    var main = document.getElementById('btnMain');
    main.innerHTML = (pos + 1 >= order.length ? 'Xem kết quả' : 'Câu tiếp theo') +
      window.EMIcon('right', 'ico-sm');
    main.onclick = next;
    main.focus();
  }

  function next() {
    pos++;
    if (pos >= order.length) result();
    else render();
  }

  /* ==========================================================  KẾT QUẢ */
  function result() {
    var total = order.length;
    var pct = Math.round(score / total * 100);
    prog.style.width = '100%';

    var msg = pct >= 85 ? 'Rất tốt — chủ điểm này gần như đã vững.'
            : pct >= 60 ? 'Khá ổn. Vài quy tắc còn lung lay, ôn lại các câu sai là đủ.'
            : 'Còn nhiều chỗ chưa chắc. Nên đọc lại bài học trước khi luyện tiếp.';

    var list = wrong.length
      ? '<div class="card res-list anim anim-1">' +
          '<div class="card-head"><h2>' + window.EMIcon('flag') + 'Đã thêm ' + wrong.length +
            ' lỗi vào sổ</h2><span class="hint">Ôn lại sau 1 ngày</span></div>' +
          wrong.map(function (w) {
            return '<div class="res-row">' +
              '<span class="badge badge-err">' + esc(w.q.tag) + '</span>' +
              '<span class="res-main"><s>' + esc(w.user) + '</s> → <b>' +
                esc(w.q.answers[0]) + '</b>' +
                '<span>' + esc(w.q.topic) + ' · ' + esc(w.q.level) + '</span></span>' +
            '</div>';
          }).join('') +
        '</div>'
      : '<div class="empty anim anim-1" style="width:100%">' + window.EMIcon('sparkle') +
        '<b>Không có lỗi nào mới</b><p>Cả phiên không sai câu nào — sổ lỗi giữ nguyên.</p></div>';

    stage.innerHTML =
      '<div class="res">' +
        '<span class="ring-lg anim" style="--p:' + pct + '"><span>' + pct + '%</span></span>' +
        '<div>' +
          '<p class="res-title anim">' + score + ' / ' + total + ' câu đúng</p>' +
          '<p class="res-sub anim" style="margin-top:5px">' + msg + '</p>' +
        '</div>' +
        list +
        '<div class="q-actions anim anim-2">' +
          (wrong.length ? '<button class="btn" id="btnRetry">' + window.EMIcon('refresh') +
            ' Ôn lại ' + wrong.length + ' câu sai</button>' : '') +
          '<a class="btn btn-primary btn-lg" href="index.html">' + window.EMIcon('check') +
            ' Xong</a>' +
        '</div>' +
        '<p class="focus-foot"><span><span class="kbd">Esc</span> về thư viện chủ điểm</span></p>' +
      '</div>';

    window.EMHydrate();

    var retry = document.getElementById('btnRetry');
    if (retry) retry.onclick = function () {
      order = wrong.map(function (w) { return QS.indexOf(w.q); });
      pos = 0; score = 0; wrong = [];
      render();
    };
  }

  /* ==========================================================  PHÍM TẮT */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { location.href = 'index.html'; return; }

    var q = QS[order[pos]];
    if (!q) return;

    if (e.key === 'Enter') {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'textarea' && !e.ctrlKey && !e.metaKey && !answered) {
        /* Trong textarea: Enter để nộp, Shift+Enter để xuống dòng */
        if (e.shiftKey) return;
      }
      e.preventDefault();
      if (answered) next(); else submit(q);
      return;
    }

    if (!answered && q.type === 'mcq' && ['1', '2', '3', '4'].indexOf(e.key) > -1) {
      var i = +e.key - 1;
      if (i < q.options.length) pickOption(q, i);
    }
  });

  render();
})();
</script>
</body>
</html>
